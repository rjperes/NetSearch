name: Publish to NuGet

on:
  release:
    types:
      - created

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NetSearch.slnx

      - name: Build
        run: dotnet build NetSearch/NetSearch.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack NetSearch/NetSearch.csproj --configuration Release --no-build

      - name: Push package
        run: dotnet nuget push "NetSearch/bin/Release/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
