name: Build and Test

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NetSearch.slnx

      - name: Build
        run: dotnet build NetSearch.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test NetSearch.Tests/NetSearch.Tests.csproj --configuration Release --no-build
